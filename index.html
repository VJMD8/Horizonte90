<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Horizonte 90</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#263e50,#080e18 75%);color:#f4f2e9;font:18px system-ui,sans-serif;min-height:100vh}main{max-width:850px;margin:auto;padding:28px}header{border-bottom:2px solid #dca64b;padding-bottom:15px}h1{font-size:clamp(32px,6vw,60px);margin:0;letter-spacing:3px}small,.gold{color:#f5c46b}h2{font-size:30px}p{line-height:1.5}button,textarea,input,select{font:inherit}button{display:block;width:100%;text-align:left;padding:15px;margin:10px 0;border:1px solid #58768c;border-radius:8px;background:#142737;color:white;cursor:pointer}button:hover,button.sel{border-color:#f5c46b;background:#344333}button.next{background:#e4b456;color:#101820;font-weight:bold;text-align:center}button:disabled{opacity:.4;cursor:default}textarea,input,select{width:100%;background:#101b29;color:white;border:1px solid #58768c;border-radius:6px;padding:12px}textarea{min-height:85px}aside{padding:16px;border-left:4px solid #e4b456;background:#142332}#clock{float:right;font-variant-numeric:tabular-nums;color:#f5c46b}pre{white-space:pre-wrap;font:inherit;background:#142332;padding:18px}label{display:block;margin-top:18px}</style><main><header><span id="clock">20:00</span><small>TRANSMISIÓN CONFIDENCIAL · AÑO 2035</small><h1>HORIZONTE 90</h1><small>PROTOCOLO DE EMERGENCIA</small></header><section id="stage"></section></main><script>const s=document.getElementById('stage');let team='',step=0,choice=-1,answers=[],notes=[],start;const opts=['Aplicar restricciones inmediatas para reducir el consumo.','Reorganizar la distribución y controlar las pérdidas.','Movilizar a las comunidades y establecer acuerdos.','Implementar una solución tecnológica innovadora.'];const reports=['El consumo disminuye rápidamente, pero aumentan las protestas y la percepción de injusticia.','La distribución mejora y se reducen pérdidas, pero los procedimientos retrasan la atención a las zonas más afectadas.','Las comunidades se comprometen y mejoran sus hábitos, pero la crisis avanza más rápido que los acuerdos.','La tecnología muestra resultados prometedores, pero aparecen fallas y desconfianza en parte de la población.'];const second=['Mantener la estrategia sin cambios.','Ajustarla parcialmente.','Rediseñar el enfoque.','Detener la implementación y buscar otra alternativa.'];function intro(){s.innerHTML='<h2>Activación de la misión</h2><p>La Región Delta ha perdido el 40% de sus reservas de agua. La tensión social aumenta. Ustedes han sido seleccionados para dirigir la recuperación.</p><aside>Trabajen en pareja. Tienen 20 minutos para completar cuatro decisiones. Acuerden cada respuesta antes de avanzar. No hay una única solución correcta.</aside><label>Nombre del equipo</label><select id="team"><option>Alfa</option><option>Beta</option></select><button class="next" onclick="begin()">Activar misión</button>'}function begin(){team=document.getElementById('team').value.trim()||'Equipo';start=Date.now();setInterval(()=>{let n=Math.max(0,1200-Math.floor((Date.now()-start)/1000));document.getElementById('clock').textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')},250);step=1;render()}function render(){choice=-1;let title='',context='',options=[];if(step===1){title='01 · La decisión inicial';context='Solo pueden activar inicialmente uno de estos cuatro protocolos.';options=opts}else if(step===2){title='02 · Las consecuencias';context='15 días después: '+reports[answers[0]]+' Las autoridades exigen una respuesta. ¿Qué hacen ahora?';options=second}else if(step===3){title='03 · La verdad incompleta';context=(team==='Alfa'?'Las reservas podrían agotarse antes de lo previsto. Las autoridades exigen resultados inmediatos.':'Varias comunidades amenazan con abandonar la colaboración porque sienten que no fueron escuchadas.')+' Otro equipo dispone de información complementaria.';options=['Continuar con nuestra información y asumir la decisión.','Solicitar comunicación con el otro equipo antes de decidir.']}else{title='04 · La decisión definitiva';context='Construyan una respuesta sostenible. Pueden combinar protocolos.';options=['Mantener el protocolo inicial','Combinar protocolos','Diseñar una estrategia nueva']}s.innerHTML='<small>ETAPA '+step+' DE 4</small><h2>'+title+'</h2><aside>'+context+'</aside>'+options.map((x,i)=>'<button class="opt" onclick="pick('+i+')">'+String.fromCharCode(65+i)+'. '+x+'</button>').join('')+'<label for="reason">'+(step===4?'¿Qué tres acciones tomarían, a quién involucrarían y cómo evaluarían su impacto?':'¿Por qué eligieron esta opción?')+'</label><textarea id="reason" oninput="validate()" placeholder="Acuerden una respuesta breve..."></textarea><button id="next" class="next" disabled onclick="advance()">'+(step===4?'Finalizar misión':'Confirmar y continuar')+'</button>'}function pick(i){choice=i;document.querySelectorAll('.opt').forEach((b,j)=>b.classList.toggle('sel',i===j));validate()}function validate(){document.getElementById('next').disabled=choice<0||!document.getElementById('reason').value.trim()}function advance(){answers.push(choice);notes.push(document.getElementById('reason').value.trim());if(step<4){step++;render()}else finish()}function finish(){let summary=team+' — Horizonte 90\n\n1. '+opts[answers[0]]+'\nMotivo: '+notes[0]+'\n\n2. '+second[answers[1]]+'\nMotivo: '+notes[1]+'\n\n3. '+['Continuar de forma independiente.','Solicitar comunicación con el otro equipo.'][answers[2]]+'\nRespuesta final: '+notes[2]+'\n\n4. '+['Mantener el protocolo inicial','Combinar protocolos','Diseñar una estrategia nueva'][answers[3]]+'\nPlan final: '+notes[3];s.innerHTML='<small>MISIÓN COMPLETADA</small><h2>¿Desde qué lugar lideraron?</h2><p>Compartan el resumen con el facilitador. Regresen a la sala principal para conversar sobre sus decisiones.</p><pre id="summary"></pre><button class="next" onclick="copySummary()">Copiar resumen para el chat</button><p id="status"></p>';document.getElementById('summary').textContent=summary}async function copySummary(){let t=document.getElementById('summary').textContent;try{await navigator.clipboard.writeText(t);document.getElementById('status').textContent='Resumen copiado.'}catch(e){let r=document.createRange();r.selectNodeContents(document.getElementById('summary'));window.getSelection().removeAllRanges();window.getSelection().addRange(r);document.getElementById('status').textContent='Texto seleccionado. Presionen Ctrl+C o Cmd+C para copiar.'}}intro();</script></html>
